name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # Install dev extras so pyright can resolve runtime/test dependencies
      # while it analyzes the package, tests, examples, and maintained scripts.
      - run: pip install -e ".[dev]"
      - run: pyright
      # The dashboard's REST types are generated from the FastAPI app's
      # OpenAPI schema, so an unmirrored response-shape change has to fail
      # the build rather than a panel.  It lives in this job rather than in
      # ``webui`` because the generator imports the package: this is the job
      # that already has it installed, and duplicating the install would
      # double CI's heaviest step for one diff.  ``webui`` keeps the
      # sibling parity check for the committed bundle.
      - name: Verify the generated dashboard types are current
        run: python scripts/generate_webui_types.py --check

  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # Coverage is informational only — no --cov-fail-under, and --cov stays out
      # of pyproject addopts so local runs without pytest-cov keep working.
      - run: pytest -q -m "not gpu" --cov=drowse --cov-report=term-missing

  # Stable aggregator so branch protection can require a single ``test`` context
  # instead of every ``test-matrix (x.y)`` leg by name. ``if: always()`` makes the
  # gate run even when a leg fails, and the explicit result check turns a failed or
  # skipped matrix into a failed gate (a skipped required check would otherwise let
  # a PR merge).
  test:
    runs-on: ubuntu-latest
    needs: [test-matrix]
    if: always()
    steps:
      - name: Verify the test matrix succeeded
        run: |
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "test-matrix did not succeed: ${{ needs.test-matrix.result }}"
            exit 1
          fi

  build:
    # Validates the PEP 621 dynamic-version setup in pyproject.toml: confirms
    # ``python -m build`` resolves ``drowse.__version__`` via AST parse without
    # executing the module (which would import torch and break the build).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - name: Seed a stale dashboard build cache
        run: python scripts/check_package_isolation.py seed
      - run: python -m build --sdist --wheel
      - name: Verify wheel dashboard files match the source distribution
        run: python scripts/check_package_isolation.py check
      - name: Verify wheel imports and version round-trips
        run: |
          pip install dist/drowse_ai-*.whl
          python -c "import drowse; from importlib.metadata import version; assert version('drowse.ai') == drowse.__version__; print('version:', drowse.__version__)"

  webui:
    runs-on: ubuntu-latest
    env:
      DROWSE_STORAGE_BROWSERS: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install Python artifact dependencies
        run: pip install -e .
      - run: npm ci
        working-directory: webui
      - name: Install the pinned Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox
        working-directory: webui
      - run: npm run check
        working-directory: webui
      - run: npm run check:hosted
        working-directory: webui
      - run: npm run test:hosted
        working-directory: webui
      - run: npm run test:e2e
        working-directory: webui
      - run: npm run build
        working-directory: webui
      - name: Verify default and hosted builds are isolated
        run: |
          node scripts/check-build-isolation.mjs default ../drowse/web/dist
          node scripts/check-build-isolation.mjs hosted dist-hosted
        working-directory: webui
      - name: Verify committed web bundle is current
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- drowse/web/dist/)" ]; then
            git status --short --untracked-files=all -- drowse/web/dist/
            exit 1
          fi

  webkit-storage:
    runs-on: macos-15
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium webkit
      - run: node scripts/iphone-storage.test.mjs

  contact-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui/contact-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            webui/package-lock.json
            webui/contact-worker/package-lock.json
      - name: Install dependencies for shared contact validation
        run: npm ci
        working-directory: webui
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  fitting-wasm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust components and WebAssembly target
        run: |
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --manifest-path browser-runtime/fitting-wasm/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --locked --manifest-path browser-runtime/fitting-wasm/Cargo.toml
      - name: Run Clippy
        run: cargo clippy --locked --manifest-path browser-runtime/fitting-wasm/Cargo.toml --all-targets -- -D warnings
      - name: Build optimized WebAssembly module
        run: cargo build --locked --release --target wasm32-unknown-unknown --manifest-path browser-runtime/fitting-wasm/Cargo.toml
      - name: Install the pinned wasm-bindgen packager
        if: runner.os == 'macOS'
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      # Compare on the same host architecture that produces the committed assets;
      # Cargo's host-dependent metadata changes Wasm function ordering on Linux.
      - name: Verify committed browser bindings are reproducible
        if: runner.os == 'macOS'
        run: npm run check:fitting-wasm
        working-directory: webui
